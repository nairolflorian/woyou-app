# woyou.de = PRODUKTION (Container woyou_app_prod, 127.0.0.1:3051). Wird von scripts/prod-einrichten.sh als
# /etc/nginx/sites-available/woyou-de-app.conf installiert und ersetzt die statische Seite (woyou-preview.conf).
# Zertifikat für woyou.de und www.woyou.de existiert bereits (Certbot). Alte .html-Adressen leitet die App
# selbst mit 301 weiter (next.config.ts). Staging bleibt unter woyou-app.46.225.109.84.nip.io (woyou-app.conf, Port 3050).

server {
    server_name woyou.de;
    client_max_body_size 8M;

    location / {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/woyou.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woyou.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www → ohne www
server {
    server_name www.woyou.de;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/woyou.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woyou.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://woyou.de$request_uri;
}

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name woyou.de www.woyou.de;
    return 301 https://woyou.de$request_uri;
}
